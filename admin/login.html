<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="utf-8">
    <title>EasyBuy 管理員登入</title>
    <link rel="stylesheet" href="../lib/layui/layui.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="login-wrapper">
        <h2 style="text-align: center; margin-bottom: 20px;">EasyBuy 管理後台</h2>
        <form class="layui-form">
            <div class="layui-form-item">
                <input type="text" name="username" required lay-verify="required" placeholder="使用者名稱" autocomplete="off"
                    class="layui-input" value="admin">
            </div>
            <div class="layui-form-item">
                <input type="password" name="password" required lay-verify="required" placeholder="密碼"
                    autocomplete="off" class="layui-input" value="admin">
            </div>
            <div class="layui-form-item">
                <button class="layui-btn layui-btn-fluid" lay-submit lay-filter="login">登入</button>
            </div>
        </form>
    </div>

    <script src="../lib/layui/layui.js"></script>
    <script src="../lib/mock_data.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
