<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="utf-8">
    <title>訂單與結算</title>
    <link rel="stylesheet" href="../lib/layui/layui.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="layui-layout-body">
    <div class="layui-layout layui-layout-admin">
        <div class="layui-header">
            <div class="layui-logo">EasyBuy 管理後台</div>
            <ul class="layui-nav layui-layout-right">
                <li class="layui-nav-item"><a href="#" id="logoutBtn">登出</a></li>
            </ul>
        </div>

        <div class="layui-side layui-bg-black">
            <div class="layui-side-scroll">
                <ul class="layui-nav layui-nav-tree">
                    <li class="layui-nav-item"><a href="index.html">儀表板</a></li>
                    <li class="layui-nav-item"><a href="schedules.html">日程管理</a></li>
                    <li class="layui-nav-item"><a href="products.html">產品管理</a></li>
                    <li class="layui-nav-item"><a href="members.html">會員管理</a></li>
                    <li class="layui-nav-item"><a href="tobuy.html">待購清單</a></li>
                    <li class="layui-nav-item layui-this"><a href="orders.html">訂單與結算</a></li>
                </ul>
            </div>
        </div>

        <div class="layui-body">
            <div style="padding: 15px;">
                <div class="layui-card">
                    <div class="layui-card-header">
                        已購項目 (待結算)
                    </div>
                    <div class="layui-card-body">
                        <table id="settleTable" lay-filter="settleTable"></table>
                    </div>
                </div>

                <div class="layui-card" style="margin-top: 20px;">
                    <div class="layui-card-header">
                        已結算訂單
                    </div>
                    <div class="layui-card-body">
                        <table id="historyTable" lay-filter="historyTable"></table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 結算表單 -->
    <script type="text/html" id="settleForm">
        <form class="layui-form" style="padding: 20px;" lay-filter="formTest">
            <div class="layui-form-item">
                <label class="layui-form-label">產品</label>
                <div class="layui-input-block">
                    <input type="text" name="productName" class="layui-input" disabled>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">原價</label>
                <div class="layui-input-block">
                    <input type="text" name="originalPrice" class="layui-input" disabled>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">最終價格</label>
                <div class="layui-input-block">
                    <input type="number" name="finalPrice" required lay-verify="required" placeholder="當地貨幣最終價格" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">幣種</label>
                <div class="layui-input-block">
                    <input type="text" name="finalCurrency" required lay-verify="required" placeholder="例如: TWD" class="layui-input" value="TWD">
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-input-block">
                    <button class="layui-btn" lay-submit lay-filter="confirmSettle">確認結算</button>
                </div>
            </div>
        </form>
    </script>

    <script type="text/html" id="barDemo">
        <a class="layui-btn layui-btn-xs" lay-event="settle">結算</a>
    </script>

    <script src="../lib/layui/layui.js"></script>
    <script src="../lib/mock_data.js"></script>
    <script src="js/orders.js"></script>
</body>

</html>
