<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyBuy - 商品</title>
    <link rel="stylesheet" href="../lib/bulma.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .product-grid {
            display: flex;
            flex-wrap: wrap;
            margin: -5px;
        }

        .product-item {
            width: 50%;
            padding: 5px;
            box-sizing: border-box;
        }

        .product-card {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .card-content {
            flex-grow: 1;
            padding: 10px;
        }

        .product-price {
            color: #ff3860;
            font-weight: bold;
            font-size: 1.1em;
        }
    </style>
</head>

<body>
    <nav class="navbar is-primary is-fixed-top" role="navigation" aria-label="main navigation">
        <div class="navbar-brand">
            <a class="navbar-item" href="index.html">
                <span class="icon"><i class="fas fa-arrow-left"></i></span>
            </a>
            <div class="navbar-item has-text-weight-bold">
                商品列表
            </div>
        </div>
    </nav>

    <section class="section" style="padding-top: 60px; padding-bottom: 80px;">
        <div class="container">
            <div id="productList" class="product-grid">
                <!-- 商品將在此載入 -->
            </div>
        </div>
    </section>

    <div class="bottom-nav">
        <div class="level is-mobile" style="width: 100%;">
            <div class="level-left">
                <div class="level-item">
                    <div>
                        <p class="heading" style="margin-bottom: 0;">已訂購</p>
                        <p class="title is-6" id="footerTotalQuantity">0 件</p>
                    </div>
                </div>
                <div class="level-item ml-4">
                    <div>
                        <p class="heading" style="margin-bottom: 0;">總計</p>
                        <p class="title is-6" style="color: #ff3860;" id="footerTotalAmount">HKD 0</p>
                    </div>
                </div>
            </div>
            <div class="level-right">
                <div class="level-item">
                    <div>
                        <p class="heading" style="margin-bottom: 0; text-align: right;">截止訂購</p>
                        <p class="title is-6" id="footerDeadline" style="color: #ff3860;">Loading...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 商品詳情 Modal -->
    <div id="productModal" class="modal">
        <div class="modal-background"></div>
        <div class="modal-content">
            <div class="box">
                <figure class="image is-4by3 mb-4">
                    <img id="modalImage" src="" alt="Product Image">
                </figure>
                <h3 class="title is-4" id="modalTitle"></h3>
                <p class="subtitle is-5 has-text-danger" id="modalPrice"></p>
                <div class="content">
                    <p id="modalDescription"></p>
                </div>
            </div>
        </div>
        <button class="modal-close is-large" aria-label="close"></button>
    </div>

    <script src="../lib/jquery.min.js"></script>
    <script src="../lib/mock_data.js"></script>
    <script src="js/products.js"></script>
</body>

</html>
